name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar tag con SHA
        id: meta
        run: |
          IMAGE_REPO="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${IMAGE_REPO}:${{ github.sha }}"
          echo "image_repo=${IMAGE_REPO}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        run: |
          docker build -t "${{ steps.meta.outputs.image_tag }}" -t "${{ steps.meta.outputs.image_repo }}:latest" .
          docker push "${{ steps.meta.outputs.image_tag }}"
          docker push "${{ steps.meta.outputs.image_repo }}:latest"

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Habilitar SSH para el runner
        id: allow-ip
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "runner_ip=${RUNNER_IP}" >> $GITHUB_OUTPUT
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" || true

      - name: Desplegar contenedor en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            NEW_IMAGE="${{ needs.build-and-push.outputs.image_tag }}"
            CONTAINER_NAME="api-libros"
            ENV_FILE="/home/ubuntu/.env.libros"

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            sudo docker pull "${NEW_IMAGE}"

            if [ "$(sudo docker ps -aq -f name=^/${CONTAINER_NAME}-prev$)" ]; then
              sudo docker rm -f "${CONTAINER_NAME}-prev" || true
            fi

            if [ "$(sudo docker ps -aq -f name=^/${CONTAINER_NAME}$)" ]; then
              sudo docker stop "${CONTAINER_NAME}" || true
              sudo docker rename "${CONTAINER_NAME}" "${CONTAINER_NAME}-prev"
            fi

            sudo docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              --env-file "${ENV_FILE}" \
              -e APP_VERSION="1.1.0-${{ github.sha }}" \
              -p 127.0.0.1:3000:3000 \
              "${NEW_IMAGE}"

            sleep 4

            if curl -fsS http://127.0.0.1/health > /tmp/health.json && curl -fsS http://127.0.0.1/libros > /tmp/libros.json; then
              cat /tmp/health.json
              cat /tmp/libros.json
              if [ "$(sudo docker ps -aq -f name=^/${CONTAINER_NAME}-prev$)" ]; then
                sudo docker rm -f "${CONTAINER_NAME}-prev" || true
              fi
            else
              sudo docker rm -f "${CONTAINER_NAME}" || true
              if [ "$(sudo docker ps -aq -f name=^/${CONTAINER_NAME}-prev$)" ]; then
                sudo docker rename "${CONTAINER_NAME}-prev" "${CONTAINER_NAME}"
                sudo docker start "${CONTAINER_NAME}"
              fi
              exit 1
            fi

      - name: Cerrar regla temporal SSH
        if: always()
        run: |
          if [ -n "${{ steps.allow-ip.outputs.runner_ip }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.EC2_SG_ID }}" \
              --protocol tcp \
              --port 22 \
              --cidr "${{ steps.allow-ip.outputs.runner_ip }}/32" || true
          fi
